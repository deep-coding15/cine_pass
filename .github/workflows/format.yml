name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.33.0'
          cache: true

      - name: Install dependencies (workspace needs Flutter SDK)
        run: flutter pub get

      - name: Check format server
        working-directory: cine_pass_server
        run: dart format --set-exit-if-changed .

      - name: Check format client
        working-directory: cine_pass_client
        run: dart format --set-exit-if-changed .

      - name: Check format Flutter app
        working-directory: cine_pass_flutter
        run: dart format --set-exit-if-changed .
