name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '3.4.0'
      # Must match cine_pass_server/docker-compose.yaml (postgres / postgres_test POSTGRES_PASSWORD)
      SERVERPOD_PASSWORD_database: 'mervy'
      SERVERPOD_PASSWORD_redis: 'rM75gPjdpqRz8IN1AhKGuG712P1FeP24'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          cache: true

      - name: Install dependencies (workspace needs Flutter SDK)
        run: flutter pub get

      - name: Start containers
        working-directory: cine_pass_server
        run: docker compose up --build -d

      - name: Install PostgreSQL client (psql)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for test Postgres
        env:
          PGPASSWORD: 'mervy'
        run: |
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 9090 -U postgres -d cine_pass_test; then
              echo "Postgres is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time." >&2
          exit 1

      - name: Apply Serverpod dependency migrations (pub packages)
        working-directory: cine_pass_server
        env:
          PGPASSWORD: 'mervy'
        run: bash scripts/apply_serverpod_dependency_migrations.sh

      - name: Install Serverpod CLI
        working-directory: cine_pass_server
        run: dart pub global activate serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: cine_pass_server
        run: serverpod generate

      - name: Run tests
        working-directory: cine_pass_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: cine_pass_server
        run: docker compose down -v
