name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '3.4.0'
      # Must match cine_pass_server/docker-compose.yaml (postgres / postgres_test POSTGRES_PASSWORD)
      SERVERPOD_PASSWORD_database: 'mervy'
      SERVERPOD_PASSWORD_redis: 'rM75gPjdpqRz8IN1AhKGuG712P1FeP24'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: Install dependencies (workspace needs Flutter SDK)
        run: flutter pub get

      - name: Start containers
        working-directory: cine_pass_server
        run: docker compose up --build -d

      - name: Install Serverpod CLI
        working-directory: cine_pass_server
        run: dart pub global activate serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: cine_pass_server
        run: serverpod generate

      - name: Run tests
        working-directory: cine_pass_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: cine_pass_server
        run: docker compose down -v
