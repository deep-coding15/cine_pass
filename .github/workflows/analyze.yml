name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: Install dependencies (workspace needs Flutter SDK)
        run: flutter pub get

      - name: Analyze server
        working-directory: cine_pass_server
        run: dart analyze --fatal-infos

      - name: Analyze client
        working-directory: cine_pass_client
        run: dart analyze --fatal-infos

      - name: Analyze Flutter app
        working-directory: cine_pass_flutter
        run: flutter analyze --fatal-infos
