services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cine_pass
      POSTGRES_PASSWORD: mervy
    volumes:
      - cine_pass_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "4IcZEvMDVICXM2CCgldQrgI2DsaKaDzP"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cine_pass_test
      POSTGRES_PASSWORD: "dXjXcP4LlgeINCHHWQg9lferR8YmNKUx"
    volumes:
      - cine_pass_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "rM75gPjdpqRz8IN1AhKGuG712P1FeP24"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  cine_pass_data:
  cine_pass_test_data:
