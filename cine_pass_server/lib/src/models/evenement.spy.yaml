### Événement (concert, théâtre, etc.).
class: Evenement
extends: CinePassRow
table: cine_pass_evenement
fields:
  titre: String
  categorie: String
  description: String?
  lieu: String
  adresse: String?
  ville: String
  eventDate: DateTime
  eventTime: DateTime
  placesTotal: int
  prixBase: double
  posterColor: int?
  posterUrl: String?
  availableOptions: List<String>?
  structureId: UuidValue?, relation(parent=cine_pass_structure, onDelete=SetNull)
