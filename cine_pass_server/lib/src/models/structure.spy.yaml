### Structure (cinéma, salle de spectacle, organisateur) — table gérée par le schéma SQL.
class: Structure
table: cine_pass_structure
fields:
  id: UuidValue, defaultModel=random
  type: String
  name: String
  city: String
  address: String?
  website: String?
  phone: String?
indexes:
  cine_pass_structure_type_city_idx:
    fields: type, city
