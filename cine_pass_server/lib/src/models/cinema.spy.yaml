### Cinéma (lieu avec salles).
# La relation "un cinéma a plusieurs salles" est portée par Salle (champ cinemaId).
# Pas de bloc relation ici : en Serverpod, relation s'utilise sur un champ (ex: address: Address?, relation).
class: Cinema
extends: CinePassRow
table: cine_pass_cinema
fields:
  nom: String
  ville: String
  adresse: String?
  codePostal: String?
