### Séance (film + salle + créneau).
class: Seance
extends: CinePassRow
table: cine_pass_seance
fields:
  filmId: UuidValue, relation(parent=cine_pass_film, onDelete=Cascade)
  salleId: UuidValue, relation(parent=cine_pass_salle, onDelete=Cascade)
  debutAt: DateTime
  finAt: DateTime?
  format: String, default="VF"
  type: String, default="2D"
  prixBase: double
  availableOptions: List<String>?
