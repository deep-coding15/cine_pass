# Réponse API pour un film (affichage liste / détail).
class: FilmResponse
fields:
  id: String
  title: String
  genre: String
  durationMinutes: int
  synopsis: String?
  director: String?
  casting: String?
  posterColor: int?
  posterUrl: String?
  # Depuis la BDD (cine_pass_film) — affichage admin / fiche
  dateSortieStr: String?
  dateFinStr: String?
  audience: String?
